version: '3.8'

services:
  cooklikehoc:
    build:
      context: .
      dockerfile: Dockerfile
    image: cooklikehoc:latest
    container_name: cooklikehoc
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
